{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="card">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label for="email">Email</label>
  <input type="email" id="email" name="email" value="{{ email }}" required maxlength="254" autofocus>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" required maxlength="200">
  <p><button>Log in</button></p>
  <p class="muted">No account? <a href="{{ url_for('register') }}">Register as an analyst</a>.</p>
</form>
{% endblock %}
